<!-- Interactive project flower. Markup generated by scripts/gen_flower.py.

     Works with CSS alone: every petal is a plain link holding its own text,
     shown on hover or keyboard focus. The script only adds what CSS cannot do:
     lighting the related projects, and a two-step tap on touch screens.

     .eco-text is absolute and must resolve against .eco-flower, so .eco-petal
     stays static and holds neither transform nor opacity: the petals are
     placed with margins, and effects apply to the image and the pseudo-element.
-->
<style>
  .eco-flower {
    --w: 18%;
    position: relative;
    display: grid;
    grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    width: min(100%, 34rem);
    aspect-ratio: 1;
    margin: 1.5rem auto 2rem;
  }

  .main-content .eco-petal {
    grid-area: 1 / 1;
    align-self: start;
    justify-self: start;
    display: block;
    width: var(--w);
    margin-left: calc(var(--x) - var(--w) / 2);
    margin-top: calc(var(--y) - var(--w) / 2);
    color: inherit;
    text-decoration: none;
  }

  .eco-petal::before {
    content: "";
    position: absolute;
    left: 39.5%;
    top: 3%;
    width: 21%;
    height: 47%;
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    background: var(--c);
    opacity: 0.16;
    transform: rotate(var(--a));
    transform-origin: 50% 100%;
    transition: opacity 0.2s ease;
  }

  .eco-petal img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--c);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  /* A pill over the bottom of the icon: below it, the top petal would run
     under the central disc. The icons look alike, so the label stays visible. */
  .eco-name {
    position: relative;
    z-index: 2;
    left: 50%;
    display: block;
    width: max-content;
    margin-top: -0.65rem;
    padding: 0.1rem 0.5rem;
    border-radius: 1rem;
    background: var(--c);
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.35;
    color: #fff;
    transform: translateX(-50%);
    transition: opacity 0.2s ease;
  }

  .eco-center,
  .eco-text {
    position: absolute;
    inset: 26%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 1rem;
    border-radius: 50%;
    background: #fff;
    font-size: 0.875rem;
    line-height: 1.4;
    text-align: center;
    color: #606c71;
  }

  .eco-center {
    z-index: 3;
    border: 1px solid #dce6f0;
    box-shadow: 0 2px 12px rgba(21, 87, 153, 0.12);
  }

  .eco-center strong {
    font-size: 1.35rem;
    color: #155799;
  }

  .eco-text {
    z-index: 4;
    border: 2px solid var(--c);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .eco-text strong {
    font-size: 0.8rem;
    color: var(--c);
    word-break: break-word;
  }

  .eco-petal:is(:hover, :focus-visible, .is-active) .eco-text {
    opacity: 1;
    visibility: visible;
  }

  .eco-petal:is(:hover, :focus-visible, .is-active) img {
    transform: scale(1.14);
  }

  .eco-petal:is(:hover, :focus-visible, .is-active, .is-linked)::before {
    opacity: 0.34;
  }

  .eco-petal:focus-visible {
    outline: none;
  }

  .eco-petal:focus-visible img {
    outline: 3px solid #155799;
    outline-offset: 5px;
  }

  /* Dim everything that is neither the current petal nor related to it. */
  .eco-flower:has(.eco-petal:is(:hover, :focus-visible, .is-active))
    .eco-petal:not(:hover, :focus-visible, .is-active, .is-linked)
    :is(img, .eco-name) {
    opacity: 0.35;
  }

  .eco-flower:has(.eco-petal:is(:hover, :focus-visible, .is-active))
    .eco-petal:not(:hover, :focus-visible, .is-active, .is-linked)::before {
    opacity: 0.06;
  }

  .main-content .eco-open {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 67%;
    padding: 0.25rem 0.75rem;
    border-radius: 1rem;
    background: #155799;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    text-decoration: none;
    transform: translateX(-50%);
  }

  .eco-open[hidden] {
    display: none;
  }

  /* Too small to read inside the disc: the text moves under the flower, in
     space reserved by the bottom margin. */
  @media (max-width: 36rem) {
    .eco-flower {
      margin-bottom: 9.5rem;
    }

    .eco-center {
      padding: 0.5rem;
    }

    .eco-center span {
      display: none;
    }

    .eco-center strong {
      font-size: 1.1rem;
    }

    .eco-name {
      font-size: 0.625rem;
    }

    .eco-flower::after,
    .eco-text {
      position: absolute;
      inset: calc(100% + 0.5rem) 0 auto;
      min-height: 8rem;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.4;
      text-align: center;
    }

    .eco-flower::after {
      content: attr(data-hint);
      min-height: 0;
      color: #606c71;
    }

    .eco-text {
      justify-content: flex-start;
    }

    .main-content .eco-open {
      top: calc(100% + 6.25rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .eco-petal::before,
    .eco-petal img,
    .eco-name,
    .eco-text {
      transition: none;
    }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var flower = document.querySelector(".eco-flower");
    if (!flower) return;

    var petals = Array.prototype.slice.call(flower.querySelectorAll(".eco-petal"));
    var touch = window.matchMedia("(hover: none)");
    var active = null;

    var open = document.createElement("a");
    open.className = "eco-open";
    open.textContent = flower.dataset.open + " →";
    open.hidden = true;
    flower.appendChild(open);

    // Light the petals related to the given one; null clears them.
    function light(petal) {
      var links = petal ? petal.dataset.links.split(" ") : [];
      petals.forEach(function (other) {
        other.classList.toggle("is-linked", links.indexOf(other.dataset.repo) !== -1);
      });
    }

    function select(petal) {
      if (active) active.classList.remove("is-active");
      active = petal;
      if (petal) {
        petal.classList.add("is-active");
        open.href = petal.href;
      }
      open.hidden = !petal;
      light(petal);
    }

    petals.forEach(function (petal) {
      petal.addEventListener("mouseenter", function () { light(petal); });
      petal.addEventListener("focus", function () { light(petal); });
      petal.addEventListener("mouseleave", function () { light(active); });
      petal.addEventListener("blur", function () { light(active); });

      // Touch screens have no hover: the first tap shows the text, and the
      // button or a second tap on the same petal follows the link.
      petal.addEventListener("click", function (event) {
        if (!touch.matches || petal === active) return;
        event.preventDefault();
        select(petal);
      });
    });

    document.addEventListener("click", function (event) {
      if (active && !flower.contains(event.target)) select(null);
    });
  });
</script>
