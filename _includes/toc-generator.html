<!-- Styles for table of contents container - to be used with {:toc} in markdown -->
<style>
  #markdown-toc {
    background: rgba(79, 163, 220, 0.05);
    border-left: 3px solid #4fa3dc;
    padding: 16px 20px;
    margin: 24px 0;
    border-radius: 6px;
    font-size: 14px;
    list-style: none;
  }
  
  #markdown-toc::before {
    content: "📋 Sommaire / Table of Contents";
    display: block;
    font-weight: bold;
    color: #4fa3dc;
    font-size: 16px;
    margin-bottom: 12px;
  }
  
  #markdown-toc ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  
  #markdown-toc li {
    margin: 4px 0;
  }
  
  #markdown-toc a {
    color: #4fa3dc;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  
  #markdown-toc a:hover {
    color: #357abd;
    text-decoration: underline;
  }
  
  #markdown-toc ul ul {
    margin-left: 16px;
    border-left: 1px solid rgba(79, 163, 220, 0.2);
    padding-left: 12px;
    margin-top: 4px;
  }
</style>
